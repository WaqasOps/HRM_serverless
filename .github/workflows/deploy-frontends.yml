name: Deploy Frontend Portals to AWS S3 (UAT)

on:
  push:
    branches:
      - uat
    paths:
      - 'frontend/**'
      - 'devops-dashboard/**'
      - '.github/workflows/deploy-frontends.yml'

jobs:
  # 1. Main Frontend Portal
  deploy-main-frontend:
    name: Build & Deploy Main Frontend (UAT Bucket)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Upgrade to Node 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install & Build Main Frontend
        run: |
          cd frontend
          npm install
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.UAT_API_BASE_URL }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync Main Frontend to Specific S3 Bucket
        run: |
          aws s3 sync frontend/dist/ s3://${{ vars.UAT_S3_BUCKET_FRONTEND }} --delete

  # 2. DevOps Dashboard Portal
  deploy-devops-dashboard:
    name: Build & Deploy DevOps Dashboard (UAT Bucket)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Upgrade to Node 20
          cache: 'npm'
          cache-dependency-path: './devops-dashboard/package-lock.json'

      - name: Install & Build DevOps Dashboard
        run: |
          cd devops-dashboard
          npm install
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.UAT_API_BASE_URL }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync DevOps Dashboard to Specific S3 Bucket
        run: |
          aws s3 sync devops-dashboard/dist/ s3://${{ vars.UAT_S3_BUCKET_DEVOPS_DASHBOARD }} --delete