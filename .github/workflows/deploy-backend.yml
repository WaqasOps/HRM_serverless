          fi
          aws lambda wait function-updated --function-name nexushrm-uat-recruitment-service
          aws lambda update-function-configuration --function-name nexushrm-uat-recruitment-service \
            --environment "Variables={DB_HOST=${{ vars.DB_HOST }},DB_PORT=${{ vars.DB_PORT }},DB_NAME=${{ vars.DB_NAME }},DB_USER=${{ vars.DB_USER }},DB_PASSWORD=${{ secrets.DB_PASSWORD }}}"