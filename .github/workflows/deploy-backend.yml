name: Deploy Backend Microservices to AWS Lambda (UAT)

on:
  push:
    branches:
      - uat
    paths:
      - 'services/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy-services:
    name: Build & Deploy Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Setup Node.js (For Auth, Employee, Attendance, Lambda Authorizer)
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 2. Setup Java (For Leave & Recruitment Services)
      - name: Set up JDK 17 for Java Services
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Setup Python (For Payroll Service)
      - name: Set up Python 3.11 for Python Services
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Setup Go (For Performance Service)
      - name: Set up Go for Performance Service
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # AWS Configuration
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # --- NODE.JS SERVICES ---

      - name: Deploy Auth Service (Node.js)
        run: |
          cd services/auth-service
          npm install --production
          zip -r auth-service.zip .
          aws lambda update-function-code --function-name nexushrm-uat-auth-service --zip-file fileb://auth-service.zip

      - name: Deploy Employee Service (Node.js)
        run: |
          cd services/employee-service
          npm install --production
          zip -r employee-service.zip .
          aws lambda update-function-code --function-name nexushrm-uat-employee-service --zip-file fileb://employee-service.zip

      - name: Deploy Attendance Service (Node.js)
        run: |
          cd services/attendance-service
          npm install --production
          zip -r attendance-service.zip .
          aws lambda update-function-code --function-name nexushrm-uat-attendance-service --zip-file fileb://attendance-service.zip

      # --- JAVA SERVICES (Maven) ---

      - name: Deploy Leave Service (Java)
        run: |
          cd services/leave-service
          mvn clean package -DskipTests
          JAR_FILE=$(ls target/*.jar | head -n 1)
          aws lambda update-function-code --function-name nexushrm-uat-leave-service --zip-file fileb://$JAR_FILE

      - name: Deploy Recruitment Service (Java)
        run: |
          cd services/recruitment-service
          mvn clean package -DskipTests
          JAR_FILE=$(ls target/*.jar | head -n 1)
          aws lambda update-function-code --function-name nexushrm-uat-recruitment-service --zip-file fileb://$JAR_FILE

      # --- PYTHON SERVICES ---

      - name: Deploy Payroll Service (Python)
        run: |
          cd services/payroll-service
          pip install -r requirements.txt -t .
          zip -r payroll-service.zip .
          aws lambda update-function-code --function-name nexushrm-uat-payroll-service --zip-file fileb://payroll-service.zip

      # --- GO SERVICES ---

      - name: Deploy Performance Service (Go)
        run: |
          cd services/performance-service
          # Go binary ko Linux target (Lambda) ke liye compile karna
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o bootstrap main.go
          zip performance-service.zip bootstrap
          aws lambda update-function-code --function-name nexushrm-uat-performance-service --zip-file fileb://performance-service.zip